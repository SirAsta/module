name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build DLL
        run: msbuild SkidBase\SkidBase.vcxproj /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Build UI
        run: msbuild UI\UI.csproj /m /p:Configuration=Release /p:Platform=AnyCPU /verbosity:minimal

      - uses: actions/upload-artifact@v4
        with:
          name: skid-dll
          path: SkidBase/bin/skid.dll
