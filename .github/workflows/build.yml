name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild SkidBase.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - uses: actions/upload-artifact@v4
        with:
          name: Module-dll
          path: Release/Module.dll
